name: Blazor
on:
  pull_request:
  push:
    branches: [main]
    paths: ['blazor/**', 'src/**', 'dist/**', 'package*.json', '.gitmodules', '.github/workflows/blazor.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked-in Blazor version from main
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  blazor:
    permissions:
      contents: write
    uses: wieslawsoltes/Dockyard/.github/workflows/blazor.yml@82d4a2a1ae9884744ff9859b83b6a400ad45720a
    with:
      project: blazor/src/RBushWeb.Blazor.csproj
      package_name: RBushWeb
      publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    secrets: inherit
