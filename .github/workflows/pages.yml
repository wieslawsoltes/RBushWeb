name: Deploy showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Test the built GitHub Pages layout
        run: npm run test:browser
        env:
          RBUSH_DEMO_ROOT: site
          RBUSH_DEMO_BASE_PATH: /RBushWeb/
          RBUSH_DEMO_SCREENSHOT: test-results/pages-build/demo-desktop.png
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - name: Deploy showcase
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the live Spatial Lab
        env:
          RBUSH_DEMO_URL: ${{ steps.deployment.outputs.page_url }}
          RBUSH_DEMO_SCREENSHOT: test-results/pages-live/demo-desktop.png
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$RBUSH_DEMO_URL" --output /dev/null
          npm run test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pages-browser-verification
          path: test-results/
          if-no-files-found: ignore
